
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#092F25">

<title>Za Dačickým | Plným plynem Kutnou Horou</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --green: #092F25;
  --gold: #D9BE7B;
  --cream: #F5E6C5;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--green);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--green);
  color: var(--cream);
  font-family: 'Montserrat', sans-serif;
}

.background {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(
      rgba(4,24,18,.38),
      rgba(4,24,18,.7)
    ),
    url("pozadi.png") center / cover no-repeat;
}

.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 540px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0 auto;

  padding:
    calc(30px + env(safe-area-inset-top))
    18px
    calc(35px + env(safe-area-inset-bottom));

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.logo {
  display: block;
  width: min(42vw,160px);
  height: auto;
  border-radius: 50%;
  margin-bottom: 25px;
  filter: drop-shadow(0 8px 18px rgba(0,0,0,.5));
}

.ornament {
  color: var(--gold);
  font-size: 20px;
  letter-spacing: 5px;
  margin-bottom: 17px;
}

h1 {
  margin: 0 0 25px;
  font-family: 'Cinzel',serif;
  font-size: clamp(25px,6.5vw,36px);
  line-height: 1.3;
  text-shadow: 0 3px 12px #000;
}

.card {
  width: 100%;
  padding: 28px 19px;
  border: 1px solid var(--gold);
  border-radius: 16px;
  background: rgba(8,37,28,.95);
  box-shadow: 0 12px 35px rgba(0,0,0,.45);
}

.riddle {
  padding: 28px 14px;
  border: 1px solid rgba(217,190,123,.55);
  border-radius: 12px;
  background: linear-gradient(
    145deg,
    rgba(29,77,56,.75),
    rgba(7,31,24,.9)
  );
}

.verse {
  margin: 0;
  font-family: 'Cinzel',serif;
  font-size: clamp(12px,3.2vw,16px);
  font-weight: 600;
  line-height: 2.1;
}

.highlight {
  color: #E7CD91;
}

.divider {
  margin: 25px auto;
  color: var(--gold);
  font-size: 20px;
  letter-spacing: 6px;
}

.next-button {
  display: block;
  width: 100%;
  padding: 21px 14px;
  border: 2px solid #F0D99B;
  border-radius: 13px;
  background: linear-gradient(135deg,#E9D29A,#B38A47);
  color: var(--green);
  font-family: 'Montserrat',sans-serif;
  font-size: 17px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 5px 0 #6C502A;
}

.next-button:disabled {
  opacity: .7;
  cursor: default;
}

.next-button:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}

/* AUDIO */

.audio-panel {
  display: none;
  margin-top: 23px;
  padding: 20px 14px;
  border: 1px solid var(--gold);
  border-radius: 12px;
  background: rgba(5,29,21,.85);
}

.audio-panel.visible {
  display: block;
}

.audio-panel h2 {
  margin: 0 0 12px;
  color: var(--gold);
  font-family: 'Cinzel',serif;
  font-size: 19px;
}

.audio-panel p {
  margin: 0 0 15px;
  font-size: 13px;
  line-height: 1.7;
}

audio {
  display: block;
  width: 100%;
  margin-top: 12px;
}

.retry-button {
  display: none;
  width: 100%;
  margin-top: 15px;
  padding: 15px 12px;
  border: 2px solid #F0D99B;
  border-radius: 10px;
  background: #E9D29A;
  color: var(--green);
  font-family: 'Montserrat',sans-serif;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.retry-button.visible {
  display: block;
}

.footer {
  margin-top: 30px;
  color: #D5C097;
  font-size: 11px;
  letter-spacing: 1px;
}

@media (max-width:390px) {
  .container {
    padding-left: 14px;
    padding-right: 14px;
  }

  .card {
    padding: 22px 13px;
  }

  .riddle {
    padding: 22px 10px;
  }
}
</style>
</head>

<body>

<div class="background"></div>

<main class="container">

  <img
    class="logo"
    src="Logo.jpg"
    alt="Plným plynem Kutnou Horou"
  >

  <div class="ornament">✦ ⚜ ✦</div>

  <h1>🍷 ZA DAČICKÝM!</h1>

  <section class="card">

    <div class="riddle">
      <p class="verse">

        Jeden rodák z Heslova tu kdysi žil,<br>
        není místo, kde on by se neopil.
        <br><br>

        Původ on měl šlechtický,<br>

        <span class="highlight">
          ano, správně, jmenoval se Dačický!
        </span>

      </p>
    </div>

    <div class="divider">✦ ⚜ ✦</div>

    <button
      type="button"
      class="next-button"
      id="nextButton"
    >
      🍷 TAK JDEME K DAČICKÉMU!
    </button>

    <div class="audio-panel" id="audioPanel">

      <h2>🎧 POSLOUCHEJTE!</h2>

      <p id="audioMessage">
        Právě se přehrává nahrávka.
        Po jejím skončení budete automaticky pokračovat.
      </p>

      <audio
        id="dacickyAudio"
        preload="none"
        controls
        playsinline
      >
        <source src="dacicky.mp3" type="audio/mpeg">
        Váš prohlížeč nepodporuje přehrávání audia.
      </audio>

      <button
        type="button"
        class="retry-button"
        id="retryButton"
      >
        ▶️ SPUSTIT NAHRÁVKU
      </button>

    </div>

  </section>

  <div class="footer">
    ✦ PRIMAGAS • KUTNÁ HORA 2026 ✦
  </div>

</main>

<script>
const nextButton = document.getElementById("nextButton");
const audioPanel = document.getElementById("audioPanel");
const audioMessage = document.getElementById("audioMessage");
const dacickyAudio = document.getElementById("dacickyAudio");
const retryButton = document.getElementById("retryButton");

let audioStarted = false;

/* KLIKNUTÍ NA TLAČÍTKO */

nextButton.addEventListener("click", function() {
  if (audioStarted) return;

  audioStarted = true;
  nextButton.style.display = "none";
  audioPanel.classList.add("visible");

  audioPanel.scrollIntoView({
    behavior: "smooth",
    block: "nearest"
  });

  playAudio();
});

/* PŘEHRÁNÍ NAHRÁVKY */

async function playAudio() {
  retryButton.classList.remove("visible");

  try {
    await dacickyAudio.play();

    audioMessage.textContent =
      "Právě se přehrává nahrávka. Po jejím skončení budete automaticky pokračovat na další stanoviště.";

  } catch (error) {
    audioMessage.textContent =
      "Automatické přehrávání se nepodařilo spustit. Klepněte na tlačítko níže nebo použijte přehrávač.";

    retryButton.classList.add("visible");
  }
}

/* RUČNÍ SPUŠTĚNÍ */

retryButton.addEventListener("click", playAudio);

/* PO SKONČENÍ MP3 PŘECHOD NA S18 */

dacickyAudio.addEventListener("ended", function() {
  localStorage.setItem("kh_s17_completed", "1");
  window.location.href = "s18.html";
});

/* CHYBA SOUBORU */

dacickyAudio.addEventListener("error", function() {
  audioMessage.textContent =
    "Nahrávku se nepodařilo načíst. Zkontrolujte soubor dacicky.mp3 na GitHubu.";

  retryButton.classList.add("visible");
});
</script>

</body>
</html>
