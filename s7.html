
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>S7 | Plným plynem Kutnou Horou</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;

  background:
    linear-gradient(rgba(4,24,18,.6), rgba(4,24,18,.8)),
    url("pozadi.png") center / cover;

  color: #F5E6C5;
  font-family: Arial, sans-serif;
  text-align: center;
}

.card {
  width: 100%;
  max-width: 450px;
  padding: 35px 25px;
  background: #092F25;
  border: 2px solid #D9BE7B;
  border-radius: 18px;
  box-shadow: 0 15px 40px rgba(0,0,0,.5);
}

.logo {
  width: 130px;
  max-width: 100%;
  border-radius: 50%;
  margin-bottom: 25px;
}

h1 {
  color: #D9BE7B;
  font-size: 28px;
}

p {
  line-height: 1.8;
  font-size: 16px;
}

.success {
  font-size: 50px;
  margin: 20px 0;
}

/* TLAČÍTKO POKRAČOVAT */

.next-button {
  display: block;
  width: 100%;
  margin-top: 30px;
  padding: 19px 15px;

  background: linear-gradient(135deg, #E9D29A, #B38A47);
  color: #092F25;

  border: 2px solid #F0D99B;
  border-radius: 12px;

  font-size: 17px;
  font-weight: 800;
  text-decoration: none;

  box-shadow: 0 5px 0 #6C502A;
  transition: transform .2s;
}

.next-button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 #6C502A;
}

.next-button:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}
</style>
</head>

<body>

<div class="card">

  <img src="Logo.jpg" class="logo" alt="Logo">

  <div class="success">🎉</div>

  <h1>PŘESMĚROVÁNÍ FUNGUJE!</h1>

  <p>
    Gratulujeme! 🎧<br>
    Úspěšně jste dokončili nahrávku
    o Karlu Velikém a dostali se
    na stránku <strong>s7.html</strong>.
  </p>

  <p>
    🏰 Další dobrodružství čeká!
  </p>

  <!-- PŘESMĚROVÁNÍ NA S8 -->

  <a href="s8.html" class="next-button">
    ➜ POKRAČOVAT DÁL
  </a>

</div>

</body>
</html>
